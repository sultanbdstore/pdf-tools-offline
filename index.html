<style>:root{--navy:#12343b;--teal:#0f766e;--org:#ea580c;--bg:#f3f8f7;--ink:#17262b;--mut:#5c7078;--card:#fff;--ok:#15803d;--bad:#dc2626;--line:#cfe0dd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Noto Sans Bengali","Kalpurush","SolaimanLipi","Nirmala UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
button{border:0;cursor:pointer}
#app{max-width:760px;margin:0 auto;padding:0 12px 120px}
.hd{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
.hd img{width:44px;height:44px;border-radius:12px;flex:none}
.hd h1{flex:1;margin:0;font-size:1.1rem;color:var(--navy);line-height:1.25}
.hd h1 small{display:block;font-weight:500;font-size:.72rem;color:var(--ok)}
.ib{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 1px 5px #0003;display:grid;place-items:center;font-size:19px;flex:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:sticky;top:0;z-index:6;background:var(--bg);padding:6px 0}
.tab{padding:10px 4px;border-radius:12px;background:#fff;box-shadow:0 1px 4px #0002;font-weight:700;color:var(--navy);font-size:.9rem;line-height:1.25}
.tab.on{background:var(--teal);color:#fff}
.tab span{display:block;font-size:1.3rem}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 6px #0002}
.drop{border:3px dashed #8fb5b0;border-radius:16px;padding:20px 12px;text-align:center;background:#fff;margin:10px 0}
.drop.over{background:#e0f5f1;border-color:var(--teal)}
.drop b{display:block;font-size:1.05rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;text-decoration:none;text-align:center}
.btn.g{background:var(--ok)}.btn.o{background:var(--org)}.btn.t{background:var(--teal)}.btn.w{background:#fff;color:var(--navy);border:2px solid var(--navy)}.btn.r{background:var(--bad)}
.btn.s{padding:7px 11px;font-size:.88rem;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.fi{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin:8px 0;box-shadow:0 1px 5px #0002}
.fi .th{width:56px;height:74px;flex:none}
.fi .info{flex:1;min-width:0}
.fi .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .mut{color:var(--mut);font-size:.82rem}
.fi input.rg{width:100%;padding:6px 8px;border:2px solid var(--line);border-radius:8px;margin-top:4px;font-size:.9rem}
.fi .ctl{display:flex;flex-direction:column;gap:5px}
.ctl button{width:36px;height:30px;border-radius:8px;background:#e8f1ef;font-size:15px}
.th{background:#e8eeed;border-radius:6px;display:grid;place-items:center;overflow:hidden;position:relative}
.th img{max-width:100%;max-height:100%;display:block;transition:transform .2s;background:#fff;box-shadow:0 0 0 1px #0002}
.th img.nt{opacity:.2}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pg{background:#fff;border-radius:12px;padding:6px;box-shadow:0 1px 5px #0003;position:relative;border:3px solid transparent}
.pg .th{width:100%;aspect-ratio:3/4}
.pg.sel{border-color:var(--teal);background:#e0f5f1}
.pg.sel:after{content:"✓";position:absolute;top:4px;right:4px;background:var(--teal);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.pg .lb{font-size:.74rem;color:var(--mut);text-align:center;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .no{position:absolute;top:2px;left:2px;z-index:2;background:var(--navy);color:#fff;min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-size:.8rem;font-weight:800;padding:0 6px}
.pg .acts{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.pg .acts button{height:32px;border-radius:7px;background:#e8f1ef;font-size:14px;padding:0}
.pg.dragging{opacity:.4}.pg.dover{border-color:var(--org)}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:.84rem;color:var(--mut);margin-bottom:3px}
input[type=text],input[type=number],select{width:100%;padding:11px 12px;border-radius:10px;border:2px solid var(--line);background:#fff}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0}
.chk input{width:20px;height:20px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -3px 12px #0003;padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:8}
.bar>div{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar .t{flex:1;font-size:.86rem;line-height:1.3}
.warn{background:#fff7d6;border-radius:12px;padding:10px 12px;font-size:.86rem;color:#6b5200;margin:8px 0}
.err{background:#fee2e2;color:#7f1d1d;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.9rem}
.ok{background:#dcfce7;color:#14532d;border-radius:12px;padding:12px;margin:10px 0}
.mut{color:var(--mut);font-size:.85rem}
h2{font-size:1rem;margin:4px 0 8px;color:var(--navy)}
.busy{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center}
.busy>div{background:#fff;border-radius:16px;padding:20px;width:min(86vw,340px);text-align:center}
.pb{height:12px;border-radius:7px;background:#dbe7e5;overflow:hidden;margin-top:10px}.pb i{display:block;height:100%;background:var(--teal);width:0;transition:width .15s}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;z-index:60;max-width:90vw;text-align:center;font-size:.9rem}
.mod{position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.mod>div{background:#fff;max-width:760px;width:100%;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 26px}
.mod ul{padding-left:20px;margin:6px 0}
.mod li{margin:4px 0}
.sticky{padding:4px 0}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b1e;--ink:#e6f0ee;--mut:#9db2b0;--card:#16282c;--navy:#bfe7e1;--line:#2d4a4d}.card,.drop,.fi,.pg,.tab,.ib,.bar,.mod>div,.busy>div,input[type=text],input[type=number],select{background:#16282c;color:var(--ink)}.tab.on{background:var(--teal);color:#fff}.btn{background:#2b5d63;color:#fff}.btn.w{background:#16282c;color:#bfe7e1;border-color:#4a7a7f}.btn.g{background:#15803d}.btn.o{background:#c2410c}.btn.t{background:#0f766e}.btn.r{background:#b91c1c}.ctl button,.pg .acts button{background:#24403f}.pg.sel{background:#14403d}.warn{background:#3d3410;color:#ffe9a0}.err{background:#4a1d1d;color:#fecaca}.ok{background:#12351f;color:#bbf7d0}.th{background:#22393b}.drop.over{background:#14403d}.fi input.rg{background:#16282c;color:var(--ink)}}
</style></head>

<script>/* ===== অফলাইন পিডিএফ মার্জার ও স্প্লিটার — সব কাজ ব্রাউজারেই, কোনো আপলোড নেই ===== */
const APP_VER='2026-11-18-a';
const $=(s,r=document)=>r.querySelector(s);
const BN=s=>String(s).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const EN=s=>String(s).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n<1024?BN(n)+' বাইট':n<1048576?BN((n/1024).toFixed(0))+' কেবি':BN((n/1048576).toFixed(1))+' এমবি';
const GIF='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const LS={g(k,d){try{const v=localStorage.getItem('pdft.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem('pdft.'+k,JSON.stringify(v))}catch(e){}}};
const FS=new Map();          /* ফাইল স্টোর: id -> ফাইল */
const S={tab:'merge',nid:1,merge:[],split:{fid:0,sel:new Set(),mode:'sel',txt:'',n:2},arr:{pool:[],undo:[]},res:{},img:LS.g('img','a4'),nums:false,names:{merge:'জোড়া-লাগানো',split:'',arr:'সাজানো'}};
let uid=1;
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function busy(msg,p){let b=$('#busy');if(!b){b=document.createElement('div');b.id='busy';b.className='busy';b.innerHTML='<div><b id="bm"></b><div class="pb"><i id="bp"></i></div></div>';document.body.appendChild(b)}$('#bm').textContent=msg;$('#bp').style.width=Math.round((p||0)*100)+'%'}
function unbusy(){const b=$('#busy');if(b)b.remove()}
const tick=()=>new Promise(r=>setTimeout(r,0));
function errMsg(e){const m=String(e&&e.message||e);if(/encrypt/i.test(m))return 'পাসওয়ার্ড/এনক্রিপশন দেওয়া PDF সমর্থিত নয় — আগে পাসওয়ার্ড খুলে (সেভ করে) নিন।';if(/Failed to parse|No PDF header|Invalid|parse/i.test(m))return 'ফাইলটি পড়া যায়নি (নষ্ট বা অসমর্থিত PDF)।';if(/memory|allocation|Array buffer/i.test(m))return 'ফোনের মেমরি কম পড়েছে — ফাইল ছোট করে বা কম পেজ নিয়ে চেষ্টা করুন।';return m}
/* ---------- সংখ্যা/রেঞ্জ ---------- */
function parseTokens(str,n){const t=EN(String(str||'')).replace(/[–—~]/g,'-').split(/[,;،\s]+/).filter(Boolean);const out=[];
 for(const x of t){const m=x.match(/^(\d*)-(\d*)$/);let a,b;if(m){a=m[1]?+m[1]:1;b=m[2]?+m[2]:n}else if(/^\d+$/.test(x)){a=b=+x}else throw new Error('"'+x+'" বুঝতে পারিনি। উদাহরণ: 1-3, 5, 8-');
  if(a<1||b>n||a>b)throw new Error('পেজ '+BN(a)+'–'+BN(b)+' ঠিক নয় (মোট '+BN(n)+' পেজ)।');out.push([a-1,b-1])}return out}
function parseRange(str,n){if(!String(str||'').trim())return [...Array(n).keys()];const idx=[];parseTokens(str,n).forEach(([a,b])=>{for(let i=a;i<=b;i++)idx.push(i)});return idx}
/* ---------- ফাইল পড়া ---------- */
function exifOrient(u8){try{if(u8[0]!=0xFF||u8[1]!=0xD8)return 1;let p=2;while(p<u8.length-4){if(u8[p]!=0xFF)break;const mk=u8[p+1],len=(u8[p+2]<<8)|u8[p+3];if(mk==0xE1&&u8[p+4]==0x45&&u8[p+5]==0x78){const t=p+10,le=u8[t]==0x49;const r16=o=>le?u8[o]|(u8[o+1]<<8):(u8[o]<<8)|u8[o+1];const r32=o=>le?(u8[o]|(u8[o+1]<<8)|(u8[o+2]<<16)|(u8[o+3]<<24)):((u8[o]<<24)|(u8[o+1]<<16)|(u8[o+2]<<8)|u8[o+3]);const ifd=t+r32(t+4);const c=r16(ifd);for(let i=0;i<c;i++){const e=ifd+2+i*12;if(r16(e)==0x0112)return r16(e+8)}return 1}p+=2+len}}catch(e){}return 1}
async function normImage(f,bytes){const u8=new Uint8Array(bytes);const isJ=u8[0]==0xFF&&u8[1]==0xD8,isP=u8[0]==0x89&&u8[1]==0x50;let fmtN=isP?'png':'jpg';
 const bm=await createImageBitmap(new Blob([bytes],{type:f.type||''}));let w=bm.width,h=bm.height;
 if(!(isP||(isJ&&exifOrient(u8)==1))){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(!isP){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(bm,0,0);const png=!isJ&&!isP;const blob=await new Promise(r=>c.toBlob(r,png?'image/png':'image/jpeg',.92));bytes=await blob.arrayBuffer();fmtN=png?'png':'jpg'}
 bm.close&&bm.close();return {bytes,fmt:fmtN,w,h}}
async function addFiles(list,silent){const ids=[],bad=[];const arr=[...list];
 for(let k=0;k<arr.length;k++){const f=arr[k];busy('ফাইল পড়া হচ্ছে… '+BN(k+1)+'/'+BN(arr.length),k/arr.length);await tick();
  try{const ext=(f.name.split('.').pop()||'').toLowerCase();let bytes=await f.arrayBuffer();
   if(f.type=='application/pdf'||ext=='pdf'){const d=await PDFLib.PDFDocument.load(bytes,{updateMetadata:false});const id=S.nid++;FS.set(id,{id,name:f.name,size:f.size,kind:'pdf',bytes,n:d.getPageCount(),lib:d});ids.push(id)}
   else if((f.type||'').startsWith('image/')||['jpg','jpeg','png','webp','bmp','gif'].includes(ext)){const im=await normImage(f,bytes);const id=S.nid++;FS.set(id,{id,name:f.name,size:f.size,kind:'img',bytes:im.bytes,fmt:im.fmt,w:im.w,h:im.h,n:1});ids.push(id)}
   else throw new Error('শুধু PDF ও ছবি (JPG/PNG/WebP) সমর্থিত।')}
  catch(e){bad.push(f.name+' — '+errMsg(e))}}
 unbusy();if(bad.length&&!silent)S.err=bad.join('\n');else S.err=bad.length?bad.join('\n'):'';return ids}
/* ---------- থাম্বনেইল ---------- */
let pdfjsLib=null;async function pdfjs(){if(!pdfjsLib){pdfjsLib=await import('./lib/pdf.min.mjs');pdfjsLib.GlobalWorkerOptions.workerSrc='./lib/pdf.worker.min.mjs'}return pdfjsLib}
const TH=new Map();let tq=Promise.resolve();
async function renderThumb(f,p){const lib=await pdfjs();if(!f.js)f.js=lib.getDocument({data:f.bytes.slice(0)}).promise;const doc=await f.js;const page=await doc.getPage(p+1);const v1=page.getViewport({scale:1});const sc=240/Math.max(v1.width,v1.height);const vp=page.getViewport({scale:sc});const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);await page.render({canvas:c,viewport:vp}).promise;page.cleanup();const u=c.toDataURL('image/jpeg',.72);c.width=c.height=0;return u}
function thumb(fid,p){const k=fid+':'+p;if(TH.has(k))return TH.get(k);const f=FS.get(fid);let pr;
 if(f.kind=='img'){pr=Promise.resolve(f.url||(f.url=URL.createObjectURL(new Blob([f.bytes],{type:f.fmt=='png'?'image/png':'image/jpeg'}))))}
 else{pr=tq.then(()=>renderThumb(f,p)).catch(()=>null);tq=pr}
 TH.set(k,pr);return pr}
const IO=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const im=e.target;IO.unobserve(im);thumb(+im.dataset.f,+im.dataset.p).then(u=>{if(u&&im.isConnected)im.src=u;else im.classList.add('nt')})}),{rootMargin:'400px'});
function lazy(root){root.querySelectorAll('img[data-f]').forEach(im=>IO.observe(im))}
const timg=(fid,p,rot,sty)=>{if(!fid)return `<div class="th" style="${sty||'width:100%;height:100%'};background:#fff;color:#999;font-size:.8rem">ফাঁকা</div>`;return `<div class="th" ${sty?`style="${sty}"`:''}><img src="${GIF}" data-f="${fid}" data-p="${p}" alt="" style="${rot?`transform:rotate(${rot}deg)${rot%180?' scale(.72)':''}`:''}"></div>`}
/* ---------- PDF তৈরি ---------- */
async function buildPdf(items,o={}){const {PDFDocument,degrees,StandardFonts,rgb}=PDFLib;const out=await PDFDocument.create();let i=0;
 while(i<items.length){const it=items[i];
  if(!it.fid){const pg=out.addPage([595,842]);const r=it.rot||0;if(r)pg.setRotation(degrees(r));i++}
  else{const f=FS.get(it.fid);
   if(f.kind=='pdf'){let j=i;const idx=[];while(j<items.length&&items[j].fid==it.fid){idx.push(items[j].p);j++}
    const pgs=await out.copyPages(f.lib,idx);pgs.forEach((pg,k)=>{const r=items[i+k].rot||0;if(r)pg.setRotation(degrees((((pg.getRotation().angle+r)%360)+360)%360));out.addPage(pg)});i=j}
   else{const im=f.fmt=='png'?await out.embedPng(f.bytes):await out.embedJpg(f.bytes);let w=im.width,h=im.height,pw,ph,dw,dh,x,y;
    if(S.img=='a4'){const land=w>h;pw=land?842:595;ph=land?595:842;const m=24;const s2=Math.min((pw-2*m)/w,(ph-2*m)/h);dw=w*s2;dh=h*s2;x=(pw-dw)/2;y=(ph-dh)/2}else{pw=dw=w;ph=dh=h;x=y=0}

   else if(sp.mode=='rest'){const rest=[...Array(f.n).keys()].filter(i=>!sp.sel.has(i));if(!sel.length)throw new Error('যে পেজ বাদ দেবেন সেগুলো বাছুন।');if(!rest.length)throw new Error('সব পেজ বাদ দিলে কিছুই থাকে না।');groups.push(['বাকি',rest])}

document.addEventListener('change',e=>{const t=e.target;if(t.id=='fin'){onFiles(t.files);t.value='';return}const f=t.dataset&&A[t.dataset.a];if(f&&(t.tagName=='SELECT'||t.type=='checkbox'))f(t)});

async function onFiles(list){if(!list||!list.length)return;S.err='';
 if(S.tab=='merge'){const ids=await addFiles(list);ids.forEach(id=>S.merge.push({fid:id,range:''}))}
 else if(S.tab=='split'){const pdfs=[...list].filter(f=>f.type=='application/pdf'||/\.pdf$/i.test(f.name));if(!pdfs.length){S.err='এখানে একটি PDF বাছুন।'}else{const ids=await addFiles([pdfs[0]]);if(ids.length){S.split={fid:ids[0],sel:new Set(),mode:S.split.mode,txt:'',n:S.split.n};S.names.split='';S.res.split=null}}}
 else{const ids=await addFiles(list);snap();ids.forEach(id=>{const f=FS.get(id);for(let p=0;p<f.n;p++)S.arr.pool.push({id:uid++,fid:id,p,rot:0})})}
 render()}

 const g=$('#agrid');if(g){let from=-1;g.addEventListener('dragstart',e=>{const c=e.target.closest('.pg');if(!c)return;from=+c.dataset.i;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(from))}catch(x){}});g.addEventListener('dragover',e=>{e.preventDefault();const c=e.target.closest('.pg');g.querySelectorAll('.dover').forEach(x=>x.classList.remove('dover'));if(c)c.classList.add('dover')});g.addEventListener('dragend',()=>render());g.addEventListener('drop',e=>{e.preventDefault();const c=e.target.closest('.pg');if(!c||from<0)return;const to=+c.dataset.i;if(to!=from){snap();mv(S.arr.pool,from,to)}from=-1;render()})}}

function about(){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div><h2>ℹ️ অফলাইন পিডিএফ মার্জার ও স্প্লিটার</h2>
 <p>🔒 <b>গোপনীয়তা:</b> সব কাজ আপনার ডিভাইসের ব্রাউজারেই হয়। কোনো ফাইল কোনো সার্ভারে যায় না — অ্যাপের সুরক্ষা-নীতি (CSP) ব্রাউজারকেই বাইরে ডেটা পাঠাতে দেয় না। একবার খুললে ইন্টারনেট ছাড়াও চলে।</p>
 <h2>যা করতে পারে</h2><ul><li>একাধিক PDF/ছবি জোড়া লাগানো (পেজ রেঞ্জসহ)</li><li>পেজ বাছাই করে আলাদা PDF, প্রতি পেজ/রেঞ্জ/N পেজ ধরে ভাগ (ZIP)</li><li>পেজ সরানো, ঘোরানো, মুছা, কপি, ফাঁকা পেজ বসানো, উল্টো ক্রম, পেজ নম্বর</li></ul>
 <h2>সীমাবদ্ধতা (সৎভাবে)</h2><ul><li>পাসওয়ার্ড/এনক্রিপশন দেওয়া PDF সমর্থিত নয়।</li><li>বুকমার্ক/সূচিপত্র, ফর্মের ঘর ও কিছু লিঙ্ক জোড়া/আলাদা করলে হারাতে পারে — শুধু পেজের চেহারা ঠিক থাকে।</li><li>ফাইল ডিভাইসের মেমরিতে খোলা হয়; খুব বড় (শত এমবি) ফাইলে ফোন আটকে যেতে পারে।</li><li>থাম্বনেইলে কিছু বিশেষ ফন্ট/ছবি ঠিক না-ও দেখাতে পারে; তৈরি PDF-এ মূল পেজই থাকে।</li><li>পেজ নম্বরে শুধু ইংরেজি সংখ্যা (1, 2, 3…) বসে।</li></ul>
 <h2>ইনস্টল</h2><p>Chrome মেনু (⋮) → <b>Install app / Add to Home screen</b>।</p>${DIP?'<button class="btn g full" id="inst">📲 এখনই ইনস্টল করুন</button>':''}
